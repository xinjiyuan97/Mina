# The profile selected when a run does not name a model explicitly.
default_model = "primary"

# The server has one native reducer-backed Agent implementation.
[agent]
kind = "agent-loop"
system_prompt = "You are Mina, a helpful agent. Complete the user's task accurately and concisely."
max_steps = 8
# Hard limits for a complete run, each model round, and each tool execution.
run_timeout_seconds = 900
model_timeout_seconds = 600
tool_timeout_seconds = 30
# Only tools explicitly declaring parallel-safe, immediate execution overlap.
tool_call_strategy = "parallel-safe" # sequential | parallel-safe

# Numeric Tool review filter, analogous to a logging threshold:
# Low=10, Medium=50, High=90. Use 0 for all Tools or 100 for none.
[approval]
review_level = 50

# Embedded, dependency-free-on-the-host JavaScript runtime. Source and input
# are digest-only in public events and ordinary logs.
[script.quickjs]
enabled = true
max_source_bytes = 262144
timeout_ms = 2000
memory_bytes = 33554432
max_stack_bytes = 1048576
max_output_bytes = 1048576
max_concurrent_executions = 2

# Run-scoped Agent Defined Functions. The foundational profile only permits
# synchronous, capability-free JavaScript functions.
[adf]
enabled = true
max_active_per_run = 8

# Durable background jobs exposed through the medium-risk `async_job` tool.
# The server only dispatches kinds on this explicit host allowlist.
[jobs]
enabled = true
allowed_kinds = ["builtin.delay"]

# Upper orchestration layer. All concrete implementations are selected here;
# AgentLoop only consumes the resulting context and allowed tool set.
[orchestration]
skill_directory = "skills"
max_skills = 8
# default_skills = [{ skill_id = "rust-helper", version = "1.0.0" }]
memory_enabled = true
memory_scope = "global"
max_memories = 8
compressor = "hybrid" # noop-fail | sliding-window | hybrid
context_policy_version = 1
reserved_tool_schema_tokens = 4096
max_skill_tokens = 16384
max_memory_tokens = 16384
max_history_tokens = 64000

[models.primary]
model = "gpt-4.1"
context_window = 128000
max_output_tokens = 16384

[models.primary.modalities]
input = ["text", "image", "document"]
output = ["text"]

[models.primary.provider]
type = "openai-compatible"
base_url = "https://api.openai.com/v1"
protocol = "chat-completions" # chat-completions | responses
# `config/mina.toml` is ignored by Git; replace this value in your local copy.
api_key = "replace-with-your-api-key"
# organization = "org-example"
# project = "project-example"

# Additional profiles can use another OpenAI-compatible endpoint.
# [models.local]
# model = "local-model"
#
# [models.local.provider]
# type = "openai-compatible"
# base_url = "http://127.0.0.1:11434/v1"
# api_key = "not-required"

# Anthropic Messages API uses the same provider-neutral ModelPort in Core.
