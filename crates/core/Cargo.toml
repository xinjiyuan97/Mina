[package]
name = "agent-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Single-agent operator engine, lifecycle APIs and portable contracts"

[dependencies]
base64.workspace = true
tracing.workspace = true
async-stream.workspace = true
futures-core.workspace = true
futures-util.workspace = true
jsonschema.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
serde_yaml = "0.9.34"
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio.workspace = true
tokio-util.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# jsonschema -> ahash uses getrandom for hash seeding. Browser builds select
# getrandom's Web Crypto backend explicitly via the workspace cargo config.
getrandom = { version = "0.3.4", features = ["wasm_js"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
tokio-util = { version = "0.7.17", features = ["rt"] }
uuid = { version = "1.25.0", features = ["serde", "v4", "v5", "js"] }

[dev-dependencies]
agent-extension = { workspace = true, features = ["adf", "builtin-tools", "sqlite", "filesystem"] }
tempfile.workspace = true
jsonschema = { workspace = true, features = ["draft202012"] }

[lints]
workspace = true
