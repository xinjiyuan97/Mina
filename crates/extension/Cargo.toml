[package]
name = "agent-extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "External providers, tools, stores, sandboxes and observability adapters"

[features]
default = []
adf = ["dep:jsonschema", "dep:sha2", "dep:tokio"]
openai = [
    "dep:async-stream",
    "dep:base64",
    "dep:eventsource-stream",
    "dep:futures-util",
    "dep:reqwest",
]
workspace = []
workspace-native = ["workspace", "dep:sha2", "dep:tokio"]
workspace-opfs = [
    "workspace",
    "dep:js-sys",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]
workspace-skill = ["workspace", "dep:sha2", "dep:toml"]
workspace-s3 = ["workspace", "dep:aws-sdk-s3"]
builtin-tools = ["host-sandbox", "workspace-native", "dep:time"]
pptx = ["ooxml"]
pptx-tools = ["builtin-tools", "pptx"]
xlsx = ["ooxml"]
xlsx-tools = ["builtin-tools", "xlsx"]
docx = ["ooxml"]
docx-tools = ["builtin-tools", "docx"]
ooxml = ["dep:quick-xml", "dep:zip"]
office-tools = ["pptx-tools", "xlsx-tools", "docx-tools"]
host-sandbox = ["dep:tokio", "dep:tokio-util"]
sqlite = ["dep:rusqlite", "dep:tokio"]
filesystem = ["dep:sha2", "dep:tokio", "dep:toml"]
observability-tracing = ["dep:async-stream", "dep:futures-util", "dep:tokio", "dep:tracing"]
context-model = ["dep:futures-util", "dep:sha2", "dep:tokio"]
full = [
    "adf",
    "openai",
    "builtin-tools",
    "office-tools",
    "host-sandbox",
    "sqlite",
    "filesystem",
    "observability-tracing",
    "context-model",
    "workspace-native",
    "workspace-skill",
]

[dependencies]
agent-core.workspace = true
async-stream = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util", "process"] }
tokio-util = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url.workspace = true
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
zip = { workspace = true, optional = true }

[dev-dependencies]
agent-core.workspace = true
axum.workspace = true
futures-util.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "context_engine"
required-features = ["sqlite"]

[lints]
workspace = true
