[package]
name = "agent-extension"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "External providers, tools, stores, sandboxes and observability adapters"

[features]
default = []
adf = ["dep:agent-harness", "dep:jsonschema", "dep:sha2", "dep:tokio"]
openai = [
    "dep:agent-harness",
    "dep:async-stream",
    "dep:eventsource-stream",
    "dep:futures-util",
    "dep:reqwest",
]
builtin-tools = ["host-sandbox", "dep:time"]
host-sandbox = ["dep:tokio", "dep:tokio-util"]
sqlite = ["dep:rusqlite", "dep:tokio"]
filesystem = ["dep:sha2", "dep:tokio", "dep:toml"]
observability-tracing = ["dep:async-stream", "dep:futures-util", "dep:tokio", "dep:tracing"]
context-model = ["dep:futures-util", "dep:sha2", "dep:tokio"]
full = [
    "adf",
    "openai",
    "builtin-tools",
    "host-sandbox",
    "sqlite",
    "filesystem",
    "observability-tracing",
    "context-model",
]

[dependencies]
agent-core.workspace = true
agent-harness = { workspace = true, optional = true }
async-stream = { workspace = true, optional = true }
eventsource-stream = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util", "process"] }
tokio-util = { workspace = true, optional = true }
toml = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
agent-core.workspace = true
agent-harness = { workspace = true, features = ["quickjs"] }
axum.workspace = true
futures-util.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true

[[test]]
name = "context_engine"
required-features = ["sqlite"]

[[test]]
name = "adf_agent_loop"
required-features = ["adf"]

[[test]]
name = "javascript_agent_loop"
required-features = ["builtin-tools"]

[[test]]
name = "async_job_agent_loop"
required-features = ["builtin-tools", "sqlite"]

[[test]]
name = "quickjs_flow"
required-features = ["sqlite"]

[lints]
workspace = true
